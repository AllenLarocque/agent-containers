# agent-containers: per-project compose file (spec §4, amended 2026-10-06).
# It lives in ~/.config/agent-containers/<project>/, OUTSIDE the project folder, and is started only
# by `agent-up up <project>`. Owner-edited. Interpolation variables come from project.conf (agent-up
# passes it as --env-file). Secret NAMES come from project.env via the generated
# .generated/env-passthrough.yaml; secret VALUES exist only in the environment of `op run`.
# T3 Connect (T3_CONNECT=1 or publish in project.conf) is added by the generated .generated/t3-connect.yaml:
# a read-only firewall switch + TUNNEL_EDGE_IP_VERSION=4; with T3_CONNECT=0 it adds nothing.
# RStudio Server (RSTUDIO=1 in project.conf) is added by the generated .generated/rstudio.yaml: the
# 127.0.0.1:<RSTUDIO_PORT> port, the rstudio-<project> volume, a read-only firewall switch and the
# read-only password file; with RSTUDIO=0 it adds nothing.
# FTP uploads (FTP_HOSTS in project.conf) are added by the generated .generated/ftp.yaml: the host list,
# read-only at /etc/firewall/ftp-hosts (tcp 21 to those hosts only); unset or empty, it adds nothing.
name: ${PROJECT:?set PROJECT in project.conf}
services:
  agent:
    image: ghcr.io/allenlarocque/spades-gis@sha256:REPLACE_WITH_DIGEST_FROM_digests.md
    user: "1000:1000"
    working_dir: /workspace
    init: true
    cap_add: [NET_ADMIN, NET_RAW]          # firewall
    mem_limit: 100g                        # state it explicitly; memory gates must read the cgroup limit
    environment:
      CLAUDE_CONFIG_DIR: /home/agent/.claude
      # Spec §12 decision B. ANY value disables (even "0"): delete the line to re-enable.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    volumes:
      - type: bind                         # the project: the agent's read-write workspace
        source: ${PROJECT_DIR:?set PROJECT_DIR in project.conf}
        target: /workspace
        bind: {create_host_path: false}
      - claude-config:/home/agent/.claude
      - codex-config:/home/agent/.codex     # Codex: ChatGPT login (auth.json), config.toml, sessions
      - npm-cache:/home/agent/.npm          # npm download cache (integrity-verified on use), shared
      - require-cache:/home/agent/.cache/R/Require
      - rlib:/home/agent/.local/share/R     # setupProject standAlone library: persists across `agent-up up`
      - type: bind                         # project allowlist: owner-maintained in THIS config dir
        source: ./allowlist
        target: /etc/firewall/allowlist.d/50-project.txt
        read_only: true
        bind: {create_host_path: false}
      - type: bind                         # personal conventions, live (rw for builders)
        source: ${SPADES_AI_DIR:?set SPADES_AI_DIR in project.conf}
        target: /opt/reference/spades.ai
        bind: {create_host_path: false}
      - type: bind                         # shared agent memory (spec §13.2; rw for builders)
        source: ${AGENT_MEMORY_DIR:?set AGENT_MEMORY_DIR in project.conf}
        target: /opt/memory
        bind: {create_host_path: false}
      - t3:/home/agent/.t3                # T3 Code: threads, pairings, server log (spec §13.1)
      # - uv-cache:/home/agent/.cache/uv  # OPTIONAL: shared uv cache for reticulate::py_require() (spec §3.4)
    # Firewall first, then agent-init, then the T3 server (images/base/agent-entrypoint.sh).
    command: ["/usr/local/bin/agent-entrypoint"]
    # T3 Code server: published on the HOST's loopback ONLY. The firewall accepts container port 3773
    # from the Docker gateway alone. Pair a browser with `agent-up pair <project>`.
    ports: ["127.0.0.1:${T3_PORT:?set T3_PORT in project.conf}:3773"]
volumes:
  claude-config:
    name: claude-${PROJECT}                # FIXED name: survives rebuilds
  codex-config:
    name: codex-${PROJECT}                 # FIXED name: the Codex login survives rebuilds
  rlib:
    name: rlib-${PROJECT}                  # FIXED name, per project
  require-cache:
    name: require-cache-shared             # shared across all SpaDES projects
    external: true
  npm-cache:
    name: npm-cache-shared                 # shared: agent CLIs download once; npm re-verifies sha512
    external: true
  t3:
    name: t3-${PROJECT}                    # FIXED name: T3 threads and pairings survive `agent-up up`
