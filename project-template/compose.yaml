# One compose project per SpaDES project. Copy this folder into the project root.
# Image: copy a digest from agent-containers/digests.md, then run ./check-digest. Secrets: run ./up (never plain compose).
# Any edit to this file (or up, resolve-secrets, check-digest, project.env, .pre-commit-config.yaml,
# .devcontainer/, .git/hooks/) needs `./up --adopt` after review: the launcher refuses changed files.
# PROJECT / COMPOSE_PROJECT_NAME come from the gitignored .env that ./resolve-secrets writes (read by compose AND VS Code).
name: ${PROJECT:-project-template}
services:
  agent:
    image: ghcr.io/allenlarocque/spades-gis@sha256:REPLACE_WITH_DIGEST_FROM_digests.md
    user: "1000:1000"
    working_dir: /workspace
    init: true
    cap_add: [NET_ADMIN, NET_RAW]          # firewall
    mem_limit: 100g                        # state it explicitly; memory gates must read the cgroup limit
    env_file:
      - path: ${HOME}/.config/agent-containers/${PROJECT:-project-template}.env   # written by ./resolve-secrets (mode 600)
        required: true
    environment:
      CLAUDE_CONFIG_DIR: /home/agent/.claude
    volumes:
      - ./:/workspace
      # Files the HOST reads or executes (./up, VS Code, compose, git), overlaid READ-ONLY on the rw
      # workspace: the agent cannot edit, rename or delete them (a mount point cannot be unlinked).
      # ./up and resolve-secrets also verify them against the owner-adopted hashes before every start.
      - {type: bind, source: ./compose.yaml, target: /workspace/compose.yaml, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./up, target: /workspace/up, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./resolve-secrets, target: /workspace/resolve-secrets, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./check-digest, target: /workspace/check-digest, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./project.env, target: /workspace/project.env, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./.env, target: /workspace/.env, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./.pre-commit-config.yaml, target: /workspace/.pre-commit-config.yaml, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./.devcontainer, target: /workspace/.devcontainer, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./.git/hooks, target: /workspace/.git/hooks, read_only: true, bind: {create_host_path: false}}
      - claude-config:/home/agent/.claude
      - require-cache:/home/agent/.cache/R/Require
      - rlib:/home/agent/.local/share/R     # setupProject standAlone library: persists across ./up
      - type: bind                         # project allowlist: OWNER-maintained on the host, OUTSIDE the
        source: ${HOME}/.config/agent-containers/${PROJECT:-project-template}.allowlist   # agent-writable workspace
        target: /etc/firewall/allowlist.d/50-project.txt
        read_only: true
        bind:
          create_host_path: false          # MUST exist (./resolve-secrets checks): never an empty root-owned dir
      - type: bind                         # personal conventions, live (rw)
        source: ${SPADES_AI_DIR:-${HOME}/GitHub/spades.ai}
        target: /opt/reference/spades.ai
        bind:
          create_host_path: false          # MUST exist on the host: fail loudly, never create a root-owned empty dir
      # - uv-cache:/home/agent/.cache/uv  # OPTIONAL: shared uv cache for reticulate::py_require() (spec §3.4)
      # - ${MEMORY_DIR}:/opt/memory        # RESERVED: future memory repo (spec §2)
    command: >
      bash -c "sudo /usr/local/bin/init-firewall.sh && /usr/local/bin/agent-init.sh && exec sleep infinity"
    # ports: ["127.0.0.1:3100:3100"]       # if ever needed: localhost ONLY
volumes:
  claude-config:
    name: claude-${PROJECT:-project-template}    # FIXED name: survives rebuilds
  rlib:
    name: rlib-${PROJECT:-project-template}      # FIXED name, per project (each project pins its own versions)
  require-cache:
    name: require-cache-shared                   # shared across all SpaDES projects
    external: true
