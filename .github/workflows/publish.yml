name: publish
on:
  push:
    branches: [main]
    paths: ["images/**", "scripts/build-publish.sh", ".github/workflows/publish.yml"]  # keep equal to PUBLISH_PATHS in scripts/verify-image.sh (tests/ci/test-publish-paths.sh)
  schedule:
    - cron: "17 9 * * 1"        # Mondays: rebuild for OS patches; does everything a push does (build, attest, promote latest)
  workflow_dispatch:
permissions:
  contents: read
  packages: write         # push the images and promote latest
  id-token: write         # sign the provenance attestations (OIDC)
  attestations: write     # store them
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'   # only main's builds may be attested and promoted (a dispatch from a branch is skipped)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (the four images + buildx cache exceed the runner's free space)
        run: |
          # Preinstalled SDKs we never use (~30 GB). Without this, pulling spades-bio back from the
          # registry for its smoke test hit "no space left on device" (2026-10-07, PR #5).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Build and smoke-test, then attest each digest, and only then promote latest: a failed attestation
      # stops the job before latest moves. Digests come from the build itself, never from a tag.
      - name: Build, push by tag, smoke-test by digest
        id: build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/build-publish.sh build ghcr.io/allenlarocque "$TAG" digests.txt
          for x in base gis bio research; do
            d=$(awk -v n="spades-$x" '$1 == n {print $2}' digests.txt)
            [[ $d =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no valid digest for spades-$x in digests.txt ('$d')"; exit 1; }
            echo "$x=$d" >> "$GITHUB_OUTPUT"
          done
      - name: Attest spades-base
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/allenlarocque/spades-base
          subject-digest: ${{ steps.build.outputs.base }}
      - name: Attest spades-gis
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/allenlarocque/spades-gis
          subject-digest: ${{ steps.build.outputs.gis }}
      - name: Attest spades-bio
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/allenlarocque/spades-bio
          subject-digest: ${{ steps.build.outputs.bio }}
      - name: Attest spades-research
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/allenlarocque/spades-research
          subject-digest: ${{ steps.build.outputs.research }}
      - name: Promote latest (only after all four attestations)
        run: scripts/build-publish.sh promote ghcr.io/allenlarocque digests.txt
