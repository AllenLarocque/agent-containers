name: tmp-flake
on:
  pull_request:
jobs:
  control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: host, no firewall at all
        run: |
          for i in $(seq 1 20); do
            curl -4 -sS -o /dev/null --connect-timeout 10 -w "host $i rc-ok connect=%{time_connect}s total=%{time_total}s code=%{http_code} ip=%{remote_ip}\n" https://www.gnu.org/ 2>&1 || echo "host $i FAILED rc=$?"
            sleep 2
          done
      - name: host, other hosts same way (control for runner egress)
        run: |
          for h in www.python.org www.r-project.org; do for i in 1 2 3 4 5; do
            curl -4 -sS -o /dev/null --connect-timeout 10 -w "$h connect=%{time_connect}s code=%{http_code}\n" https://$h/ 2>&1 || echo "$h FAILED"
          done; done
      - name: tcp probe gnu.org 443 vs 80 with timing
        run: |
          for i in $(seq 1 10); do
            s=$(date +%s.%N); timeout 6 bash -c 'exec 3<>/dev/tcp/209.51.188.116/443' && r=ok || r=fail; echo "443 $i $r $(echo "$(date +%s.%N)-$s"|bc)s"
          done
