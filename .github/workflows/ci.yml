name: ci
on:
  pull_request:
  workflow_dispatch:
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: TEMP resolve digest
        run: docker buildx imagetools inspect rocker/r-ver:4.5.3 --format '{{json .Manifest.Digest}}'
      - name: Build base
        run: docker buildx build --load -t spades-base:ci images/base
      - name: Smoke base
        run: docker run --rm -v "$PWD/tests:/tests:ro" spades-base:ci bash /tests/smoke/base.sh
