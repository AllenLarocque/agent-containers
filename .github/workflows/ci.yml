name: ci
on:
  pull_request:
    # ready_for_review: a draft skips the image build (below), so marking it ready must run the full build.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same PR cancels the run in progress (and so does marking a draft ready).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ONE build per run: the publish script itself (build, push to a local registry:2, smoke-test every
  # image BY DIGEST, promote latest, render digests.md) with layers cached in the GitHub Actions cache.
  # The remaining tests then use those exact images, pulled back as spades-*:ci.
  #
  # Fast paths (scripts/ci-classify.sh; full whenever in doubt). build-test is a REQUIRED check, so it
  # always runs and always concludes; only its steps are gated:
  #   digests  publish's digests PR (chore/digests-*, digests.md only): verify each digest on ghcr.io
  #            instead of rebuilding; publish already built and smoke-tested exactly those digests.
  #   docs     only *.md / docs/** changed (never digests.md, images/**, tests/**): nothing to build.
  #   draft    a draft PR: render-only launcher tests; the full build runs on ready_for_review.
  # The classifier is a step, not a separate job: a job this one `needs:` would make build-test
  # SKIPPED if it failed (a skipped required check counts as passing), and would delay the creation
  # of this check run, leaving a draft run's success as the latest build-test on the same SHA.
  build-test:
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry:2
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # build-publish.sh dates layers by the last commit touching each image dir
      - name: changes (full | digests | docs | draft)
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          set -o pipefail
          mode=$(scripts/ci-classify.sh "$EVENT" "$BASE" "$HEAD" "$BRANCH" "$DRAFT")
          case $mode in full|digests|docs|draft) ;; *) echo "::error::unknown mode '$mode'"; exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "::notice title=ci mode::$mode"
      - name: digests — verify every digest in digests.md on ghcr.io (no rebuild)
        if: steps.mode.outputs.mode == 'digests'
        env:
          BASE: ${{ steps.mode.outputs.base }}
        run: |
          set -o pipefail
          scripts/ci-verify-digests.sh digests.md <(git show "$BASE:digests.md") 2>&1 | tee /tmp/verify.log || {
            rc=$?
            msg=$(sed 's/%/%25/g; s/\r//g' /tmp/verify.log | awk '{printf "%s%%0A", $0}')
            echo "::error title=digests.md verification failed::$msg"
            exit "$rc"
          }
          echo "::notice title=build-test::digests.md verified on ghcr.io (no rebuild)%0A$(grep '^OK' /tmp/verify.log | awk '{printf "%s%%0A", $0}')"
      - name: docs — nothing to build
        if: steps.mode.outputs.mode == 'docs'
        run: echo "::notice title=build-test::docs-only change; no image build"
      - name: draft — launcher render tests (no image)
        if: steps.mode.outputs.mode == 'draft'
        run: |
          set -o pipefail
          bash tests/launcher/test-agent-up.sh 2>&1 | tee /tmp/launcher.log
          # The render section silently skips without docker compose; on the runner it must have run.
          if grep -q 'SKIP: render checks' /tmp/launcher.log; then echo "::error::launcher render checks were skipped"; exit 1; fi
          echo "::notice title=launcher (render-only)::$(grep -c '^OK' /tmp/launcher.log) OK, $(grep -c '^OK: *rendered' /tmp/launcher.log) of them render checks"
          echo "::notice title=build-test::image build skipped for draft; runs when marked ready"
      - name: Free runner disk (preinstalled SDKs we never use, ~30 GB)
        if: steps.mode.outputs.mode == 'full'
        run: |
          # Without this the runner filled up pulling spades-bio back for its smoke test (2026-10-07, PR #5).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # buildx runs in a docker-container builder with network=host so it reaches localhost:5000.
      - uses: docker/setup-buildx-action@v3
        if: steps.mode.outputs.mode == 'full'
        with:
          driver-opts: network=host
      # Exposes the Actions cache credentials to `docker buildx` run from a script (type=gha cache).
      - uses: crazy-max/ghaction-github-runtime@v3
        if: steps.mode.outputs.mode == 'full'
      - name: Build (cached) + push to local registry, smoke by digest, render digests.md
        if: steps.mode.outputs.mode == 'full'
        env:
          BUILD_CACHE: gha
        run: |
          # On failure, surface the log tail + disk usage as an annotation: job logs live on a blob host
          # that agent containers cannot reach, while the annotations API is readable.
          set -o pipefail
          start=$(date +%s)
          scripts/build-publish.sh localhost:5000/allenlarocque "2000.01.01-dryrun" /tmp/digests.md 2>&1 | tee /tmp/publish.log || {
            rc=$?
            msg=$( { tail -n 60 /tmp/publish.log; echo '--- df -h'; df -h /; } | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build-publish failed (rc=$rc)::$msg"
            exit "$rc"
          }
          echo "::notice title=build-publish seconds::$(( $(date +%s) - start ))"
      - name: Verify digests.md
        if: steps.mode.outputs.mode == 'full'
        run: |
          cat /tmp/digests.md
          grep -Pq '^\| spades-base \| 2000\.01\.01-dryrun \| \x60sha256:[0-9a-f]{64}\x60 \|$' /tmp/digests.md
          grep -Pq '^\| spades-bio \| 2000\.01\.01-dryrun \| \x60sha256:[0-9a-f]{64}\x60 \|$' /tmp/digests.md
          grep -Pq '^\| spades-gis \| 2000\.01\.01-dryrun \| \x60sha256:[0-9a-f]{64}\x60 \|$' /tmp/digests.md
          [ "$(grep -c '^| spades-' /tmp/digests.md)" = 3 ]
          # header must match the committed skeleton
          diff <(head -7 digests.md) <(head -7 /tmp/digests.md)
      - name: Use the pushed images as spades-*:ci for the remaining tests
        if: steps.mode.outputs.mode == 'full'
        run: |
          for img in base gis bio; do
            docker pull -q "localhost:5000/allenlarocque/spades-$img:latest"
            docker tag "localhost:5000/allenlarocque/spades-$img:latest" "spades-$img:ci"
          done
      - name: Image size report (annotation)
        if: always() && steps.mode.outputs.mode == 'full'
        run: |
          r=$( {
            echo "== images"; docker image ls --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | grep -E '^spades-(base|gis|bio):ci'
            for img in base bio; do
              echo "== spades-$img largest layers"
              docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' "spades-$img:ci" | grep -v '^0B' \
                | sort -h -r | head -n 8 | cut -c1-160
            done
            echo "== spades-base: RStudio Server (its install layer, its dir, libclang/LLVM it depends on)"
            docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' spades-base:ci | grep -m1 'rstudio-server-' | cut -c1-100
            docker run --rm -u root spades-base:ci du -sh /usr/lib/rstudio-server /usr/lib/rstudio-server/bin/quarto /usr/lib/rstudio-server/bin/node /usr/lib/llvm-18 2>/dev/null
            echo "== spades-base: RStudio's pandoc (Quarto's) and any Copilot file left (expected: none)"
            docker run --rm -u root spades-base:ci sh -c 'find /usr/lib/rstudio-server -name pandoc -type f; find /usr/lib/rstudio-server -iname "*copilot*" | head -n 20'
            echo "== spades-base: big directories"
            docker run --rm -u root spades-base:ci du -sh /usr/local/lib/R /usr/lib/x86_64-linux-gnu /usr/share /usr/local/share /opt /usr/lib/R 2>/dev/null
            echo "== spades-bio: conda"
            docker run --rm -u root spades-bio:ci du -sh /opt/conda /opt/conda/envs/* /opt/conda/pkgs 2>/dev/null
            echo "== disk"; df -h /
          } 2>&1 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=image sizes::$r"
      - name: Fresh named volumes are writable by agent (every volume in the compose template)
        if: steps.mode.outputs.mode == 'full'
        run: |
          # A fresh named volume inherits the ownership of the image dir it mounts on. The list is read from
          # the compose template itself, so a new volume cannot be added without being checked here.
          mapfile -t targets < <(grep -oE '^ +- [a-z0-9-]+:(/home/agent/[^ ]+)' project-template/config/compose.yaml | sed -E 's/.*:(\/home\/agent\/[^ ]+)/\1/')
          # Volumes that agent-up's generated overlays add (RSTUDIO=1: the rstudio-<project> volume).
          mapfile -t -O "${#targets[@]}" targets < <(grep -oE '"      - [a-z0-9-]+:/home/agent/[^ "]+' bin/agent-up | sed -E 's/.*:(\/home\/agent\/[^ "]+)/\1/')
          [ "${#targets[@]}" -ge 6 ] || { echo "parsed only ${#targets[@]} volume targets: ${targets[*]}"; exit 1; }
          args=(); i=0
          for t in "${targets[@]}"; do args+=(-v "fresh-vol-$i:$t"); i=$((i+1)); done
          printf '%s\n' "${targets[@]}"
          docker run --rm "${args[@]}" -u 1000:1000 spades-base:ci bash -c 'for t in "$@"; do touch "$t/w" || exit 1; done; echo "all volumes writable"' _ "${targets[@]}"
          # And what failed in real use: agent-init must write settings + plugins into the claude-config volume,
          # and the Codex config into the codex-config volume.
          docker run --rm -v fresh-claude:/home/agent/.claude -v fresh-codex:/home/agent/.codex spades-base:ci bash -c '/usr/local/bin/agent-init.sh 2>&1 | tee /tmp/init.log; ! grep -q WARN /tmp/init.log && test -s /home/agent/.claude/settings.json && test -s /home/agent/.codex/config.toml'
      - name: Firewall IPv6 classifier unit test (no NET_ADMIN, sources the shipped script)
        if: always() && steps.mode.outputs.mode == 'full'
        run: docker run --rm -v "$PWD/tests:/tests:ro" spades-base:ci bash /tests/firewall/test-v6-classifier.sh
      - name: Firewall test (default bridge; base + project allowlist merge + parsing; root + agent)
        if: always() && steps.mode.outputs.mode == 'full'
        run: |
          # 40-extra: last line has NO trailing newline (boundary with 50-project.txt)
          printf 'www.python.org' > /tmp/40-extra.txt
          # 50-project: CRLF first line, inline comment, blank, comment-only, last line w/o newline
          printf 'www.r-project.org\r\ncran.r-project.org  # inline comment\n\n# comment only\nwww.mozilla.org' > /tmp/50-project.txt
          # A NON-allowlisted host that really listens on TCP 22, proven reachable from the runner,
          # so a block inside the container is the firewall (not a dead port).
          SSH_PROBE_IP=$(getent ahostsv4 gitlab.com | awk 'NR==1{print $1}')
          timeout 8 bash -c "</dev/tcp/$SSH_PROBE_IP/22" && echo "runner reaches $SSH_PROBE_IP:22"
          # T3 Connect OFF (no switch mounted): a Cloudflare tunnel edge that really listens on 7844.
          EDGE_IP=$(getent ahostsv4 region1.v2.argotunnel.com | awk 'NR==1{print $1}')
          timeout 8 bash -c "</dev/tcp/$EDGE_IP/7844" && echo "runner reaches $EDGE_IP:7844"
          docker run -d --name fw --cap-add NET_ADMIN --cap-add NET_RAW \
            -v /tmp/40-extra.txt:/etc/firewall/allowlist.d/40-extra.txt:ro \
            -v /tmp/50-project.txt:/etc/firewall/allowlist.d/50-project.txt:ro \
            -v "$PWD/tests:/tests:ro" spades-base:ci sleep infinity
          UP=$(docker exec fw awk '/^nameserver/{print $2; exit}' /etc/resolv.conf); echo "original resolver: $UP"
          docker exec fw sudo /usr/local/bin/init-firewall.sh
          rc=0   # run both suites, fail at the end
          docker exec -u root -e EXPECT_UPSTREAM="$UP" fw bash /tests/firewall/test-firewall.sh || rc=1
          docker exec -u agent -e EXPECT_UPSTREAM="$UP" -e SSH_PROBE_IP="$SSH_PROBE_IP" fw bash /tests/firewall/test-agent-egress.sh || rc=1
          docker exec -u agent -e MODE=off -e EDGE_IP="$EDGE_IP" -e ANNOTATE=1 fw bash /tests/firewall/test-t3-connect.sh || rc=1
          docker rm -f fw
          exit $rc
      - name: Firewall on a compose-like network (Docker DNS 127.0.0.11) + idempotent re-run
        if: always() && steps.mode.outputs.mode == 'full'
        run: |
          printf 'www.python.org' > /tmp/40-extra.txt
          printf 'www.r-project.org\r\ncran.r-project.org  # inline comment\n\n# comment only\nwww.mozilla.org' > /tmp/50-project.txt
          # An EXPLICIT PROFILE=builder switch must give exactly the builder snapshot (test-firewall.sh).
          printf 'PROFILE=builder\n' > /tmp/profile-builder
          docker network create fwnet
          docker run -d --name fwn --network fwnet --cap-add NET_ADMIN --cap-add NET_RAW \
            -v /tmp/profile-builder:/etc/firewall/profile:ro \
            -v /tmp/40-extra.txt:/etc/firewall/allowlist.d/40-extra.txt:ro \
            -v /tmp/50-project.txt:/etc/firewall/allowlist.d/50-project.txt:ro \
            -v "$PWD/tests:/tests:ro" spades-base:ci sleep infinity
          UP=$(docker exec fwn awk '/^nameserver/{print $2; exit}' /etc/resolv.conf); echo "original resolver: $UP"
          # Non-vacuity: before the firewall, the agent CAN use Docker's resolver directly.
          docker exec -u agent fwn dig @127.0.0.11 example.com A +short +time=3 +tries=2 | grep -E '^[0-9.]+$'
          docker exec fwn sudo /usr/local/bin/init-firewall.sh
          # Second run: resolv.conf now says 127.0.0.1; the original resolver must come from /run/firewall-upstream.
          docker exec fwn sudo /usr/local/bin/init-firewall.sh
          rc=0   # run both suites, fail at the end
          docker exec -u root -e EXPECT_UPSTREAM="$UP" fwn bash /tests/firewall/test-firewall.sh || rc=1
          docker exec -u agent -e EXPECT_UPSTREAM="$UP" -e REQUIRE_DOCKER_DNS=1 fwn bash /tests/firewall/test-agent-egress.sh || rc=1
          docker rm -f fwn
          docker network rm fwnet
          exit $rc
      - name: Firewall with T3 Connect ON (compose-like network, idempotent re-run, real cloudflared)
        if: always() && steps.mode.outputs.mode == 'full'
        run: |
          # The owner's switch, mounted read-only exactly as agent-up's generated overlay does.
          printf 'T3_CONNECT=1\n' > /tmp/t3-connect
          printf 'www.python.org' > /tmp/40-extra.txt
          printf 'www.r-project.org\r\ncran.r-project.org  # inline comment\n\n# comment only\nwww.mozilla.org' > /tmp/50-project.txt
          EDGE_IP=$(getent ahostsv4 region1.v2.argotunnel.com | awk 'NR==1{print $1}')
          timeout 8 bash -c "</dev/tcp/$EDGE_IP/7844" && echo "runner reaches $EDGE_IP:7844"
          docker network create t3net
          docker run -d --name fwt3 --network t3net --cap-add NET_ADMIN --cap-add NET_RAW \
            -v /tmp/t3-connect:/etc/firewall/t3-connect:ro \
            -v /tmp/40-extra.txt:/etc/firewall/allowlist.d/40-extra.txt:ro \
            -v /tmp/50-project.txt:/etc/firewall/allowlist.d/50-project.txt:ro \
            -v "$PWD/tests:/tests:ro" spades-base:ci sleep infinity
          UP=$(docker exec fwt3 awk '/^nameserver/{print $2; exit}' /etc/resolv.conf); echo "original resolver: $UP"
          docker exec fwt3 sudo /usr/local/bin/init-firewall.sh
          docker exec fwt3 sudo /usr/local/bin/init-firewall.sh
          rc=0   # run every suite, fail at the end; FAIL lines become annotations (logs are not readable remotely)
          run(){ "$@" 2>&1 | tee -a /tmp/t3.log; return "${PIPESTATUS[0]}"; }
          run docker exec -u root -e EXPECT_UPSTREAM="$UP" -e EXPECT_T3_CONNECT=1 fwt3 bash /tests/firewall/test-firewall.sh || rc=1
          run docker exec -u agent -e EXPECT_UPSTREAM="$UP" -e REQUIRE_DOCKER_DNS=1 fwt3 bash /tests/firewall/test-agent-egress.sh || rc=1
          run docker exec -u agent -e MODE=on -e EDGE_IP="$EDGE_IP" fwt3 bash /tests/firewall/test-t3-connect.sh || rc=1
          if [ "$rc" -ne 0 ]; then
            msg=$(grep -E '^(FAIL|        )' /tmp/t3.log | head -n 40 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=T3 Connect ON firewall tests::$msg"
          fi
          docker rm -f fwt3
          docker network rm t3net
          exit $rc
      - name: Firewall research profile (compose-like network, idempotent re-run, open public egress)
        if: always() && steps.mode.outputs.mode == 'full'
        run: |
          set -o pipefail
          # The owner's switch, mounted read-only exactly as agent-up's research overlay does.
          printf 'PROFILE=research\n' > /tmp/profile-research
          # A public host on an odd port (Cloudflare's tunnel edge, 7844), proven reachable from the runner.
          EDGE_IP=$(getent ahostsv4 region1.v2.argotunnel.com | awk 'NR==1{print $1}')
          timeout 8 bash -c "</dev/tcp/$EDGE_IP/7844" && echo "runner reaches $EDGE_IP:7844"
          docker network create resnet
          docker run -d --name fwres --network resnet --cap-add NET_ADMIN --cap-add NET_RAW \
            -v /tmp/profile-research:/etc/firewall/profile:ro \
            -v "$PWD/tests:/tests:ro" spades-base:ci sleep infinity
          UP=$(docker exec fwres awk '/^nameserver/{print $2; exit}' /etc/resolv.conf); echo "original resolver: $UP"
          docker exec fwres sudo /usr/local/bin/init-firewall.sh | tee /tmp/fwres.log
          docker exec fwres sudo /usr/local/bin/init-firewall.sh
          rc=0
          grep -q '^Profile: research' /tmp/fwres.log || { echo "::error title=research firewall::no 'Profile: research' in the log"; rc=1; }
          docker exec -u root -e EXPECT_UPSTREAM="$UP" -e EDGE_IP="$EDGE_IP" -e ANNOTATE=1 fwres bash /tests/firewall/test-research.sh || rc=1
          docker rm -f fwres
          docker network rm resnet
          exit $rc
      - name: RStudio Server (switch ON; firewall snapshot; start as agent, sign in, R session; metrics)
        if: always() && steps.mode.outputs.mode == 'full'
        run: |
          # The owner's switch + password file, mounted read-only exactly as agent-up's generated overlay does.
          printf 'RSTUDIO=1\n' > /tmp/rstudio-switch
          od -An -tx1 -N16 /dev/urandom | tr -d ' \n' > /tmp/rstudio-password
          chmod 644 /tmp/rstudio-password   # CI-ONLY: the runner is not uid 1000 (in real use: 0600, host uid 1000)
          printf 'www.python.org' > /tmp/40-extra.txt
          printf 'www.r-project.org\r\ncran.r-project.org  # inline comment\n\n# comment only\nwww.mozilla.org' > /tmp/50-project.txt
          ws=$(mktemp -d); cp tests/rstudio/fixture-Rprofile "$ws/.Rprofile"; cp tests/rstudio/fixture.Rproj "$ws/fixture.Rproj"
          sudo chown -R 1000:1000 "$ws"   # CI-ONLY (as for the acceptance project)
          docker run -d --name rs --cap-add NET_ADMIN --cap-add NET_RAW \
            -e GH_TOKEN=dummy-gh -e OP_SERVICE_ACCOUNT_TOKEN=must-not-reach-r \
            -v /tmp/rstudio-switch:/etc/firewall/rstudio:ro -v /tmp/rstudio-password:/run/secrets/rstudio-password:ro \
            -v /tmp/40-extra.txt:/etc/firewall/allowlist.d/40-extra.txt:ro \
            -v /tmp/50-project.txt:/etc/firewall/allowlist.d/50-project.txt:ro \
            -v "$ws:/workspace" -v "$PWD/tests:/tests:ro" spades-base:ci sleep infinity
          UP=$(docker exec rs awk '/^nameserver/{print $2; exit}' /etc/resolv.conf); echo "original resolver: $UP"
          docker exec rs sudo /usr/local/bin/init-firewall.sh | tee /tmp/rs-fw.log
          grep -q '^RStudio Server: ON' /tmp/rs-fw.log
          rc=0   # run every suite, fail at the end; FAIL lines become annotations (logs are not readable remotely)
          run(){ "$@" 2>&1 | tee -a /tmp/rs.log; return "${PIPESTATUS[0]}"; }
          run docker exec -u root -e EXPECT_UPSTREAM="$UP" -e EXPECT_RSTUDIO=1 rs bash /tests/firewall/test-firewall.sh || rc=1
          run docker exec -u agent -e EXPECT_GH_TOKEN=dummy-gh -e ANNOTATE=1 rs bash /tests/rstudio/test-rstudio.sh || rc=1
          if [ "$rc" -ne 0 ]; then
            msg=$(grep -E '^(FAIL|        )' /tmp/rs.log | head -n 60 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=RStudio Server tests::$msg"
          fi
          docker rm -f rs
          exit $rc
      - name: Firewall rejects invalid allowlist entry without touching iptables
        if: steps.mode.outputs.mode == 'full'
        run: |
          docker run -d --name fwbad --cap-add NET_ADMIN --cap-add NET_RAW \
            -v "$PWD/tests:/tests:ro" spades-base:ci sleep infinity
          docker exec -u root fwbad bash /tests/firewall/test-invalid-token.sh
          docker rm -f fwbad
      - name: Firewall IPv6 default-deny on an IPv6-enabled Docker network
        if: always() && steps.mode.outputs.mode == 'full'
        run: |
          docker network create --ipv6 --subnet fd00:dead:beef::/48 v6net
          docker run -d --name fw6 --network v6net --cap-add NET_ADMIN --cap-add NET_RAW \
            -v "$PWD/tests:/tests:ro" spades-base:ci sleep infinity
          docker exec fw6 sudo /usr/local/bin/init-firewall.sh
          docker exec -u root fw6 bash /tests/firewall/test-ipv6.sh
          docker rm -f fw6
          docker network rm v6net
      - name: Firewall fails closed when setup breaks mid-way (dead resolver)
        if: always() && steps.mode.outputs.mode == 'full'
        run: |
          docker run -d --name fwdead --dns 192.0.2.1 --cap-add NET_ADMIN --cap-add NET_RAW \
            -v "$PWD/tests:/tests:ro" spades-base:ci sleep infinity
          docker exec -u root fwdead bash /tests/firewall/test-fail-closed.sh
          docker rm -f fwdead
      - name: Entrypoint with a failing firewall exits and starts nothing (no agent-init, no T3)
        if: always() && steps.mode.outputs.mode == 'full'
        run: |
          # Dead resolver -> init-firewall.sh fails -> agent-entrypoint must exit non-zero BEFORE
          # agent-init or the T3 server run. The image's default CMD is the entrypoint.
          docker run -d --name epfail --dns 192.0.2.1 --cap-add NET_ADMIN --cap-add NET_RAW spades-base:ci
          rc=$(timeout 180 docker wait epfail)
          docker logs epfail 2>&1 | tail -n 20
          [ "$rc" -ne 0 ] || { echo "entrypoint exited 0 despite a failing firewall"; exit 1; }
          docker logs epfail 2>&1 | grep -q "firewall setup FAILED" || { echo "no entrypoint failure message"; exit 1; }
          if docker logs epfail 2>&1 | grep -qE '\[agent-init\]|\[agent-t3\]|\[install-[a-z0-9-]+\]'; then
            echo "something started after the firewall failed"; exit 1
          fi
          docker rm -f epfail
      - name: Firewall fails closed when setup breaks LATE (dnsmasq cannot bind, after the meta fetch)
        if: always() && steps.mode.outputs.mode == 'full'
        run: |
          docker run -d --name fwlate --cap-add NET_ADMIN --cap-add NET_RAW \
            -v "$PWD/tests:/tests:ro" spades-base:ci sleep infinity
          docker exec -u root fwlate bash /tests/firewall/test-late-failure.sh
          docker rm -f fwlate
      - name: Firewall EXIT trap removes the temporary rules when the meta fetch fails
        if: always() && steps.mode.outputs.mode == 'full'
        run: |
          docker run -d --name fwtrap --cap-add NET_ADMIN --cap-add NET_RAW \
            -v "$PWD/tests:/tests:ro" spades-base:ci sleep infinity
          docker exec -u root fwtrap bash /tests/firewall/test-trap-cleanup.sh
          docker rm -f fwtrap
      - name: Firewall with a long (200-domain) allowlist
        if: always() && steps.mode.outputs.mode == 'full'
        run: |
          for i in $(seq -w 0 199); do echo "host$i.long-allowlist-test-padding-label.example.org"; done > /tmp/70-long.txt
          docker run -d --name fwlong --cap-add NET_ADMIN --cap-add NET_RAW \
            -v /tmp/70-long.txt:/etc/firewall/allowlist.d/70-long.txt:ro \
            -v "$PWD/tests:/tests:ro" spades-base:ci sleep infinity
          rc=0
          docker exec fwlong sudo /usr/local/bin/init-firewall.sh || rc=1
          docker exec -u root fwlong bash /tests/firewall/test-long-allowlist.sh || rc=1
          docker rm -f fwlong
          exit $rc
      - name: Bio allowlist example passes firewall validation
        if: steps.mode.outputs.mode == 'full'
        run: |
          # A malformed example would break every real bio project that copies it.
          docker run -d --name fwbio --cap-add NET_ADMIN --cap-add NET_RAW \
            -v "$PWD/project-template/config/allowlist.bio-example:/etc/firewall/allowlist.d/50-project.txt:ro" \
            spades-base:ci sleep infinity
          docker exec fwbio sudo /usr/local/bin/init-firewall.sh | tee /tmp/fwbio.log
          grep -q 'Allowlist: .* 50-project.txt' /tmp/fwbio.log
          docker rm -f fwbio
      - name: Launcher test (agent-up; render + behavioural against the built base image)
        if: always() && steps.mode.outputs.mode == 'full'
        run: TEMPLATE_IMAGE=spades-base:ci bash tests/launcher/test-agent-up.sh
      - name: Acceptance (setupProject behind firewall, plain Rscript)
        if: steps.mode.outputs.mode == 'full'
        run: |
          # CI-ONLY: agent (UID 1000) must be able to write .Rprofile and the project library in the
          # bind mount. Do NOT copy this chown into local scripts (it would hand your files to UID 1000).
          sudo chown -R 1000:1000 tests/acceptance/minimal-project
          docker run -d --name acc --cap-add NET_ADMIN --cap-add NET_RAW \
            -v "$PWD/tests/acceptance/minimal-project:/workspace" spades-gis:ci sleep infinity
          docker exec acc sudo /usr/local/bin/init-firewall.sh
          start=$(date +%s)
          docker exec -u agent -w /workspace acc Rscript global.R
          echo "provisioning+run seconds: $(( $(date +%s) - start ))"
          # Second plain Rscript: must load SpaDES.core from the setupProject standAlone library
          # (via the .Rprofile it wrote), not the site library.
          docker exec -u agent -w /workspace acc Rscript -e 'library(SpaDES.core); print(.libPaths()); p <- find.package("SpaDES.core"); cat("SpaDES.core from:", p, "\n"); stopifnot(startsWith(p, "/home/agent/.local/share/R/workspace/packages")); cat("second run OK\n")'
      - name: Acceptance cleanup
        if: always() && steps.mode.outputs.mode == 'full'
        run: docker rm -f acc || true

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (warning and above)
        if: always()
        run: |
          shellcheck --version
          shellcheck -S warning images/base/*.sh tests/*/*.sh scripts/*.sh bin/agent-up
      - name: CI classifier unit test (which change sets may skip the image build)
        if: always()
        run: bash tests/ci/test-classify.sh
      - name: actionlint
        if: always()
        run: |
          curl -fsSL -o /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tgz" | sha256sum -c -
          tar xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color
          /tmp/actionlint -color project-template/repo/.github/workflows/gitleaks.yml

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history, redacted)
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

