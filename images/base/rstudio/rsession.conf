# agent-containers (spec §13.3). Keys checked against session-options.json at the pinned version:
# an unknown key stops rsession from starting.
session-default-working-dir=/workspace
session-default-new-project-dir=/workspace
# Never suspend: a resumed session restores its saved state and may skip .Rprofile, losing the
# setupProject library paths.
session-timeout-minutes=0
# No AI assistants inside RStudio (nothing of theirs is allowlisted either). posit-assistant-installation
# off also stops its update checks. Copilot's language server is not even in the image (deleted at build,
# Dockerfile); these keys (and /etc/rstudio/rstudio-prefs.json copilot_enabled=false) stop RStudio from
# offering or looking for it.
copilot-enabled=0
allow-copilot=0
allow-posit-assistant=0
posit-assistant-enabled=0
posit-assistant-installation-enabled=0
