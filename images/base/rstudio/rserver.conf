# agent-containers (spec §13.3). rserver runs as the agent (uid 1000), never as root; agent-rstudio
# starts it only where the owner set RSTUDIO=1. Keys checked against server-options.json at the pinned
# version; the smoke test runs `rserver --check-config`.
# R built from source by rocker (not apt): point RStudio at it.
rsession-which-r=/usr/local/bin/R
# Not root: rserver cannot switch users, so the server user is the agent itself.
server-user=agent
# Container port; compose publishes it on the host's 127.0.0.1 only, the firewall admits the gateway only.
www-address=0.0.0.0
www-port=8787
# Sign-in REQUIRED (non-root rserver defaults to auth-none=1): user agent + the owner's password file.
auth-none=0
auth-pam-helper-path=/usr/local/lib/agent/rstudio-auth
auth-timeout-minutes=0
# Server state in the container's own layer (fresh on every recreate: no cookie key is ever shared).
server-data-dir=/var/lib/rstudio-agent/data
server-pid-file=/var/lib/rstudio-agent/rserver.pid
secure-cookie-key-file=/var/lib/rstudio-agent/secure-cookie-key
database-config-file=/etc/rstudio/agent-database.conf
# R sessions start through the wrapper (container environment, initial project).
rsession-path=/usr/local/lib/agent/rsession-agent
