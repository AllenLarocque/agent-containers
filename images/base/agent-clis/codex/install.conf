# Read by install-agent-cli, the agent CLI wrapper and `agent-up status` (KEY=VALUE, no quotes).
NAME=Codex
PACKAGE=@openai/codex
BIN=codex
# Must be installed, else refuse. On Linux the only build is a static musl binary inside this package
# (vendor/<arch>-unknown-linux-musl/bin/codex; no glibc variant); without it bin/codex.js cannot start.
NATIVE=@openai/codex-linux-{arch}
